<script>
/* 빌드 버전 — 배포 시 Actions가 커밋 sha/epoch/KST시각을 여기에 주입한다(로컬은 치환 안 됨).
   URL에 파라미터를 붙이지 않는다: 캐시 무효화는 서비스워커가 페이지·데이터를 no-store로 받아오고,
   새 배포가 감지되면 스스로 새로고침하는 방식으로 처리 (아래 서비스워커 섹션 참고) */
var BUILD = { sha: '__BUILD_SHA__', epoch: '__BUILD_EPOCH__', kst: '__BUILD_KST__' };
BUILD.local = BUILD.sha.indexOf('BUILD_SHA') > -1;
</script>

// ── 데이터 ─────────────────────────────────────────────

const POOL_KEY = 'aussiePool.v1';
const DAY_COLORS = ['#C1440E','#1D7A8C','#5B7F2B','#8C4A9E','#B8860B','#C2185B','#455A8C','#2E7D6B'];

const DEFAULT_TRIP = {

    { date: '2026-10-23', city: '시드니', places: [] },

      { name: '✈️ JQ416 시드니 출발 (국내선 T2)', time: '18:55', lat: -33.9335, lng: 151.1806, note: 'A320 · 낮엔 시드니 마무리 일정 가능 · 숙소→공항: Kings Cross→Central→T8, ~40분' },

    ]},

    { date: '2026-11-05', city: '브리즈번→서울', places: [
      { name: '🚆 에어트레인: Central → 국제선터미널', time: '08:00', lat: -27.4649, lng: 153.0262, note: '~25분 · 50센트 미적용, 1인 ~A$22 (온라인 예약 할인) · 스카이타워→Central 도보 10분' },
      { name: '🛫 브리즈번 공항 국제선 도착', time: '08:40', lat: -27.3860, lng: 153.1190, note: '출발 2시간 반 전 — TRS 세금환급 여유 시간 확보' },
      { name: '✈️ JQ53 출국', time: '11:10', lat: -27.3860, lng: 153.1190, note: 'B787-8 · ❗12:00에서 당겨진 최신 스케줄 · 인천 19:55 도착 · 마지막 활동일은 11/4' }
    ]}
  ]
};

let trip = loadTrip();
let pool = loadPool(); // 후보 풀 (친구들이 보고 고르는 목록)
let currentDay = 'all'; // 'all' | 'pool' | index

// 딥링크: ?day=3 / #day=3 / #pool / ?day=2026-10-24 — 정적 호스팅이라 경로(/day/3)는 못 쓰고 쿼리·해시로 받는다
// 후보 개별 링크: ?c=52 / #c=52 — 후보 탭을 열고 그 번호로 지도·목록을 포커스한다
function linkCandidate() {
  const q = new URLSearchParams(location.search);
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const v = q.get('c') || h.get('c');
  return v && /^\d+$/.test(v) ? +v : null;
}

// 공유용 주소 — 파라미터 없이 깔끔하게. 최신 여부는 서비스워커가 알아서 챙긴다
function candidateUrl(id) {
  return location.origin + location.pathname + '#c=' + id;
}

function focusCandidate(id) {
  const m = markerRefs['p-' + id];
  if (!m) return false;
  map.setView(m.getLatLng(), Math.max(map.getZoom(), 13));
  m.openPopup();
  const row = document.querySelector('[data-cid="' + id + '"]');
  if (row) { row.scrollIntoView({ block: 'center' }); row.style.background = '#FFF3E6'; }
  return true;
}

function linkTarget() {
  const q = new URLSearchParams(location.search);
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (linkCandidate() !== null) return 'pool';
  if (location.hash === '#pool' || q.get('tab') === 'pool' || h.get('tab') === 'pool') return 'pool';
  const v = q.get('day') || h.get('day');
  if (v) {
    if (/^\d+$/.test(v)) { const i = +v - 1; if (i >= 0 && i < trip.days.length) return i; }
    const i = trip.days.findIndex(d => d.date === v);
    if (i > -1) return i;
  }
  return null;
}

// 현재 보고 있는 탭을 주소에 반영 — 친구에게 "이 날 일정" 링크를 그대로 공유할 수 있게
function syncHash() {
  const h = currentDay === 'all' ? '' : (currentDay === 'pool' ? '#pool' : '#day=' + (currentDay + 1));
  history.replaceState(null, '', location.pathname + location.search + h);
}
let addMode = false;
let pendingLatLng = null;

function loadTrip() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const t = JSON.parse(raw); if (t && Array.isArray(t.days) && t.seed === DEFAULT_TRIP.seed) return t; }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_TRIP));
}
function saveTrip() { localStorage.setItem(STORAGE_KEY, JSON.stringify(trip)); }
function loadPool() { try { return JSON.parse(localStorage.getItem(POOL_KEY) || 'null'); } catch (e) { return null; } }
function poolList() { return (pool && Array.isArray(pool.candidates)) ? pool.candidates : []; }
function filteredPool() {
  const cs = poolList();
  if (poolFilter === 'picked') return cs.filter(c => picks.has(c.id));
  if (poolFilter !== 'all') return cs.filter(c => c.rec === poolFilter);
  return cs;
}

// 후보 선택(체크박스) — 폰에 영구 저장하지 않는다. 앱을 닫으면 사라지고, 복사해서 카톡으로 보내는 용도.
// (sessionStorage라 새 배포로 자동 새로고침이 일어나도 고르던 것은 살아남는다)
const PICK_KEY = 'aussiePick.v1';
let poolFilter = 'all'; // 'all' | '국룰' | '강추' | 'picked'
let picks = new Set();
try { picks = new Set(JSON.parse(sessionStorage.getItem(PICK_KEY) || '[]')); } catch (e) {}
function savePicks() { try { sessionStorage.setItem(PICK_KEY, JSON.stringify([...picks])); } catch (e) {} }

function pickText() {
  const cs = poolList().filter(c => picks.has(c.id));
  if (!cs.length) return '';
  const lines = [`🗂 호주 여행 후보 ${cs.length}개 골랐어요`];
  let city = null;
  cs.forEach(c => {
    if (c.city !== city) { city = c.city; lines.push(`\n[${city}]`); }
    lines.push(`${c.id}. ${c.name}`);
  });
  lines.push(`\n(${versionText()})`);
  return lines.join('\n');
}

// 아이폰 사파리에선 숨긴 textarea + execCommand 조합이 실패하는 경우가 있어 Clipboard API를 우선 쓴다
function legacyCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.readOnly = false;
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.01;font-size:16px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { ta.setSelectionRange(0, t.length); } catch (e) {}
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

function copyText(t, onDone) {
  const done = ok => { if (onDone) onDone(ok); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => done(true)).catch(() => done(legacyCopy(t)));
  } else {
    done(legacyCopy(t));
  }
}
function dayColor(i) { return DAY_COLORS[i % DAY_COLORS.length]; }

// ── 지도 ─────────────────────────────────────────────
const map = L.map('map', { zoomControl: false });
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, crossOrigin: 'anonymous',
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

const layer = L.layerGroup().addTo(map);
const markerRefs = {}; // "day-idx" -> marker

function numIcon(color, n) {
  return L.divIcon({
    className: '',
    html: `<div class="num-marker" style="background:${color};width:26px;height:26px">${n}</div>`,
    iconSize: [26, 26], iconAnchor: [13, 13]
  });
}

function visibleDays() {
  if (currentDay === 'pool') return [];
  return currentDay === 'all' ? trip.days.map((d, i) => i) : [currentDay];
}

function poolIcon(c) {
  const color = (REC[c.rec] || REC['괜찮음']).color;
  const on = picks.has(c.id);
  return L.divIcon({
    className: '',
    html: `<div class="num-marker" style="background:${color};width:24px;height:24px;font-size:11px${on ? ';border-color:#2E7D6B;border-width:3px' : ''}">${on ? '✓' : c.id}</div>`,
    iconSize: [24, 24], iconAnchor: [12, 12]
  });
}

function renderMap() {
  layer.clearLayers();
  const pts = [];
  if (currentDay === 'pool') {
    filteredPool().forEach(c => {
      const m = L.marker([c.lat, c.lng], { icon: poolIcon(c) })
        .bindPopup(`<b>${(REC[c.rec] || {}).mark || ''} ${esc(c.name)}</b><br><small>${esc(c.city)} · ${esc(c.cat)}</small><br>${c.warn ? '<b style="color:#C1440E">⚠️ ' + esc(c.warn) + '</b><br>' : ''}${esc(c.note)}`);
      layer.addLayer(m);
      markerRefs['p-' + c.id] = m;
      pts.push([c.lat, c.lng]);
    });
    if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.2));
    return;
  }
  visibleDays().forEach(di => {
    const d = trip.days[di], color = dayColor(di);
    const line = [];
    d.places.forEach((p, pi) => {
      const m = L.marker([p.lat, p.lng], { icon: numIcon(color, pi + 1) })
        .bindPopup(`<b>${esc(p.name)}</b><br>${d.date} ${p.time || ''}${p.note ? '<br>' + esc(p.note) : ''}`);
      layer.addLayer(m);
      markerRefs[di + '-' + pi] = m;
      line.push([p.lat, p.lng]);
      pts.push([p.lat, p.lng]);
    });
    if (line.length > 1) layer.addLayer(L.polyline(line, { color, weight: 3, opacity: .7, dashArray: '6 8' }));
  });
  if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.25));
  else map.setView([-25.27, 133.77], 4); // 호주 전체
}

// ── 목록/탭 ─────────────────────────────────────────────
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  const mk = (label, val, color) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (currentDay === val) { b.classList.add('on'); b.style.background = color || '#333'; }
    b.onclick = () => { currentDay = val; syncHash(); renderAll(); };
    el.appendChild(b);
  };
  mk('전체', 'all');
  if (poolList().length) mk(`🗂 후보 ${poolList().length}`, 'pool', '#444');
  trip.days.forEach((d, i) => mk(`D${i + 1} ${d.city}`, i, dayColor(i)));
}

// 후보 목록 — 도시별로 묶어서, 번호(id)로 지목할 수 있게 표시
function renderPoolList(el) {
  const cs = filteredPool();
  const bar = document.createElement('div');
  bar.className = 'pool-bar';
  bar.innerHTML = `<span class="cnt">✓ ${picks.size}개 선택</span>
    <button id="poolClear">해제</button><button id="poolCopy" class="primary">📋 복사</button>`;
  el.appendChild(bar);
  bar.querySelector('#poolClear').onclick = () => { picks.clear(); savePicks(); renderMap(); renderList(); };
  bar.querySelector('#poolCopy').onclick = () => {
    const t = pickText();
    const cnt = bar.querySelector('.cnt');
    if (!t) { cnt.textContent = '먼저 체크해주세요'; return; }
    const n = picks.size;
    copyText(t, ok => {
      cnt.textContent = ok ? `복사됨! ${n}개 — 카톡에 붙여넣기` : '복사 실패 — 편집 화면에서 직접 복사하세요';
    });
  };

  // 90개를 폰에서 다 훑기 힘드니 추천도·선택으로 걸러 본다
  const fb = document.createElement('div');
  fb.className = 'pool-filters';
  [['전체', 'all'], ['🔥국룰', '국룰'], ['⭐강추', '강추'], [`✓선택 ${picks.size}`, 'picked']].forEach(([label, val]) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (poolFilter === val) b.classList.add('on');
    b.onclick = () => { poolFilter = val; renderMap(); renderList(); };
    fb.appendChild(b);
  });
  el.appendChild(fb);

  const info = document.createElement('div');
  info.className = 'pool-info';
  info.innerHTML = cs.length
    ? `🔥국룰 &nbsp;⭐강추 &nbsp;○괜찮음 &nbsp;⚠️비추천 &nbsp;— 가고 싶은 곳 체크 후 복사 (${cs.length}개 표시)`
    : '해당하는 후보가 없어요';
  el.appendChild(info);
  let city = null;
  cs.forEach(c => {
    if (c.city !== city) {
      city = c.city;
      const h = document.createElement('div');
      h.className = 'day-head';
      h.textContent = `${city} (${cs.filter(x => x.city === city).length})`;
      el.appendChild(h);
    }
    const r = REC[c.rec] || REC['괜찮음'];
    const row = document.createElement('div');
    row.className = 'place' + (picks.has(c.id) ? ' picked' : '');
    row.dataset.cid = c.id;
    if (c.rec === '비추천') row.style.opacity = '.6';
    row.innerHTML = `<input type="checkbox" class="chk"${picks.has(c.id) ? ' checked' : ''}>
      <div class="num" style="background:${r.color};font-size:11px">${c.id}</div>
      <div class="nm">${r.mark} ${esc(c.name)}${c.warn ? '<span class="warn">주의</span>' : ''}<small>${c.warn ? '<b class="warnTxt">⚠️ ' + esc(c.warn) + '</b><br>' : ''}${esc(c.cat)} · ${esc(c.note)}</small></div>
      <button class="lnk" title="링크 복사">🔗</button>`;
    row.querySelector('.lnk').onclick = ev => {
      ev.stopPropagation();
      const cnt = el.querySelector('.pool-bar .cnt');
      copyText(`${r.mark} ${c.name}\n${candidateUrl(c.id)}`, ok => {
        if (cnt) cnt.textContent = ok ? `${c.id}번 링크 복사됨` : `${c.id}번 링크 복사 실패`;
      });
    };
    const chk = row.querySelector('.chk');
    chk.onclick = ev => {
      ev.stopPropagation();
      if (chk.checked) picks.add(c.id); else picks.delete(c.id);
      savePicks();
      row.classList.toggle('picked', chk.checked);
      const cnt = el.querySelector('.pool-bar .cnt');
      if (cnt) cnt.textContent = `✓ ${picks.size}개 선택`;
      const m = markerRefs['p-' + c.id];
      if (m) m.setIcon(poolIcon(c));
    };
    row.onclick = () => {
      const m = markerRefs['p-' + c.id];
      if (m) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 13)); m.openPopup(); }
    };
    el.appendChild(row);
  });
}

function renderList() {
  const el = document.getElementById('list');
  el.innerHTML = '';
  if (currentDay === 'pool') { renderPoolList(el); return; }
  const days = visibleDays();
  if (!days.length) { el.innerHTML = '<div class="empty">일정이 없어요. ✏️ 편집으로 추가!</div>'; return; }
  days.forEach(di => {
    const d = trip.days[di], color = dayColor(di);
    const h = document.createElement('div');
    h.className = 'day-head';
    h.textContent = `Day ${di + 1} · ${d.date} · ${d.city}`;
    h.style.color = color;
    el.appendChild(h);
    if (!d.places.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = '장소 없음'; el.appendChild(e); }
    d.places.forEach((p, pi) => {
      const row = document.createElement('div');
      row.className = 'place';
      row.innerHTML = `<div class="num" style="background:${color}">${pi + 1}</div>
        <div class="nm">${esc(p.name)}${p.note ? `<small>${esc(p.note)}</small>` : ''}</div>
        <div class="tm">${esc(p.time || '')}</div>`;
      row.onclick = () => {
        const m = markerRefs[di + '-' + pi];
        if (m) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 14)); m.openPopup(); }
      };
      el.appendChild(row);
    });
  });
}

// 배포 확인용 상시 버전 표시 (탭하면 캐시 무시하고 새로고침)
function renderVerBar() {
  const el = document.getElementById('verBar');
  const fresh = buildInfo && !BUILD.local && buildInfo.sha !== BUILD.sha;
  el.textContent = versionText();
  el.style.color = fresh ? '#C1440E' : '#999';
  el.style.fontWeight = fresh ? '700' : '400';
  el.onclick = () => location.reload();
  // 서버에 새 배포가 있으면 세션당 1회 자동 새로고침 (서비스워커가 no-store로 최신 HTML을 받아온다)
  if (fresh && !sessionStorage.getItem('reloadedFor' + buildInfo.sha)) {
    sessionStorage.setItem('reloadedFor' + buildInfo.sha, '1');
    location.reload();
  }
}

function renderAll() {
  document.getElementById('tripTitle').textContent = trip.title || '호주 여행';
  renderTabs(); renderMap(); renderList(); renderVerBar();
}

// ── 지도 탭으로 장소 추가 ─────────────────────────────
const addHint = document.getElementById('addHint');
const addForm = document.getElementById('addForm');

document.getElementById('btnAdd').onclick = () => {
  addMode = !addMode;
  if (addMode && currentDay === 'all') { currentDay = 0; renderAll(); }
  addHint.classList.toggle('show', addMode);

};

map.on('click', e => {
  if (!addMode) return;

  document.getElementById('addName').value = '';
  document.getElementById('addTime').value = '';
  addForm.classList.add('show');

});

document.getElementById('addCancel').onclick = () => addForm.classList.remove('show');
document.getElementById('addOk').onclick = () => {
  const name = document.getElementById('addName').value.trim();
  if (!name || !pendingLatLng) return;
  const di = currentDay === 'all' ? 0 : currentDay;
  trip.days[di].places.push({
    name, time: document.getElementById('addTime').value.trim(),
    lat: +pendingLatLng.lat.toFixed(5), lng: +pendingLatLng.lng.toFixed(5), note: ''
  });

  addForm.classList.remove('show');
  renderAll();
};

// ── JSON 편집 ─────────────────────────────────────────
const panel = document.getElementById('editPanel');
const area = document.getElementById('editArea');
const msg = document.getElementById('editMsg');

document.getElementById('btnEdit').onclick = () => {
  area.value = JSON.stringify(trip, null, 2);
  document.getElementById('verInfo').textContent = versionText();
  msg.textContent = '';
  panel.classList.add('show');
};
document.getElementById('editCancel').onclick = () => panel.classList.remove('show');
document.getElementById('editReset').onclick = () => { area.value = JSON.stringify(DEFAULT_TRIP, null, 2); };
document.getElementById('editCopy').onclick = () => {
  area.select(); document.execCommand('copy');
  msg.style.color = '#2E7D6B'; msg.textContent = '복사됨 — ' + versionText();
};
document.getElementById('editSave').onclick = () => {
  try {
    const t = JSON.parse(area.value);
    if (!Array.isArray(t.days)) throw new Error('days 배열이 필요해요');
    t.days.forEach((d, i) => {
      if (!Array.isArray(d.places)) throw new Error(`Day ${i + 1}에 places 배열이 없어요`);
      d.places.forEach(p => {
        if (typeof p.lat !== 'number' || typeof p.lng !== 'number') throw new Error(`"${p.name || '?'}"의 lat/lng는 숫자여야 해요`);
      });
    });
    if (t.seed === undefined) t.seed = DEFAULT_TRIP.seed; // 시드 표식 유지 — 없으면 다음 로드에서 폐기됨
    trip = t;
    if (currentDay !== 'all' && currentDay >= trip.days.length) currentDay = 'all';
    saveTrip();
    panel.classList.remove('show');
    renderAll();
  } catch (e) {
    msg.style.color = '#c00';
    msg.textContent = 'JSON 오류: ' + e.message;
  }
};

// ── 오프라인 지도 타일 저장 ───────────────────────────
const TILE_CACHE = 'tiles-v1';
const dlBar = document.getElementById('dlBar');

function tileXY(lat, lng, z) {
  const n = 2 ** z;
  const x = Math.floor((lng + 180) / 360 * n);
  const latR = lat * Math.PI / 180;
  const y = Math.floor((1 - Math.log(Math.tan(latR) + 1 / Math.cos(latR)) / Math.PI) / 2 * n);
  return [Math.min(Math.max(x, 0), n - 1), Math.min(Math.max(y, 0), n - 1)];
}

function collectTileUrls() {
  const urls = new Set();
  const all = trip.days.flatMap(d => d.places);
  if (!all.length) return urls;
  const add = (z, x, y) => urls.add(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`);

  // 각 장소 주변: 줌 12~16, 3×3 타일
  all.forEach(p => {
    for (let z = 12; z <= 16; z++) {
      const [cx, cy] = tileXY(p.lat, p.lng, z);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) add(z, cx + dx, cy + dy);
    }
  });
  // 전체 경로 개관: 줌 5~11, 한 줌당 최대 80타일까지만
  const lats = all.map(p => p.lat), lngs = all.map(p => p.lng);
  for (let z = 5; z <= 11; z++) {
    const [x1, y1] = tileXY(Math.max(...lats), Math.min(...lngs), z);
    const [x2, y2] = tileXY(Math.min(...lats), Math.max(...lngs), z);
    if ((x2 - x1 + 1) * (y2 - y1 + 1) > 80) continue;
    for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) add(z, x, y);
  }
  return urls;
}

document.getElementById('btnOffline').onclick = async () => {
  if (!('caches' in window)) { alert('이 브라우저는 오프라인 저장을 지원하지 않아요'); return; }
  const urls = [...collectTileUrls()];
  if (!urls.length) return;
  const cache = await caches.open(TILE_CACHE);
  let done = 0, fail = 0;
  dlBar.classList.add('show');
  const worker = async () => {
    while (urls.length) {
      const url = urls.pop();
      try {
        if (!await cache.match(url)) {
          let res;
          try { res = await fetch(url); }
          catch (e) { res = await fetch(url, { mode: 'no-cors' }); }
          if (res && (res.ok || res.type === 'opaque')) await cache.put(url, res);
          else fail++;
        }
      } catch (e) { fail++; }
      done++;
      if (done % 10 === 0) dlBar.textContent = `오프라인 지도 저장 중… ${done}개 완료`;
    }
  };
  const total = urls.length;
  dlBar.textContent = `오프라인 지도 저장 중… 0/${total}`;
  await Promise.all(Array.from({ length: 6 }, worker));
  dlBar.textContent = fail ? `완료 (${fail}개 실패 — 다시 눌러 재시도 가능)` : `✅ 지도 ${total}개 타일 저장 완료! 이제 오프라인에서도 보여요`;
  setTimeout(() => dlBar.classList.remove('show'), 4000);
};

// ── 원격 동기화 ───────────────────────────────────────
// data/fixed.json(확정 예약) + data/trip.json(일별 일정)을 병합해 렌더.
// rev가 바뀌었을 때만 교체 — push = 3명 폰에 배포. 오프라인이면 조용히 로컬본 유지.
function syncBadge(s) {
  const el = document.getElementById('syncState');
  if (s === 'ok') { el.textContent = '✓'; setTimeout(() => { el.textContent = ''; }, 3000); }
  else if (s === 'offline') el.textContent = '⚠︎';
  else el.textContent = '';
}

// 버전 표기: 데이터 rev(f=확정예약, t=일정, c=후보) + 실행 중인 코드의 커밋(sha·KST 커밋시각)
let buildInfo = null; // 서버에 배포된 최신 빌드 (실행 중인 BUILD와 다르면 새 배포가 있다는 뜻)
function versionText() {
  const c = pool && pool.rev != null ? '-c' + pool.rev : '';
  const b = BUILD.local ? '로컬' : `${BUILD.sha} ${BUILD.kst}`;
  const stale = buildInfo && !BUILD.local && buildInfo.sha !== BUILD.sha ? ' · 🔄 새 배포 있음(탭)' : '';
  return `데이터 ${(trip.remoteRev || '-') + c} · 빌드 ${b}${stale}`;
}

async function syncRemote() {
  try {
    const opt = { cache: 'no-cache' };
    const [fx, tp, bd, cd] = await Promise.all([
      fetch('./data/fixed.json', opt).then(r => r.json()),
      fetch('./data/trip.json', opt).then(r => r.json()),
      fetch('./data/build.json', opt).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('./data/candidates.json', opt).then(r => r.ok ? r.json() : null).catch(() => null)
    ]);
    buildInfo = bd;
    if (cd && Array.isArray(cd.candidates) && (!pool || pool.rev !== cd.rev)) {
      pool = cd;
      localStorage.setItem(POOL_KEY, JSON.stringify(cd));
      renderTabs(); if (currentDay === 'pool') { renderMap(); renderList(); }
    }
    renderVerBar();
    const rev = 'f' + (fx.rev || 0) + '-t' + (tp.rev || 0);
    if (trip.remoteRev === rev) {
      if (bd && trip.build !== bd.sha) { trip.build = bd.sha; saveTrip(); }
      renderVerBar(); syncBadge(''); return;
    }
    const days = tp.days.map(d => ({ date: d.date, city: d.city, places: (d.places || []).slice() }));
    (fx.entries || []).forEach(en => {
      const day = days.find(d => d.date === en.date);
      if (day) day.places.push({ name: en.name, time: en.time || '', lat: en.lat, lng: en.lng, note: en.note || '' });
    });
    days.forEach(d => d.places.sort((a, b) => ((a.time || '99:99') <= (b.time || '99:99') ? -1 : 1)));
    trip = { title: tp.title || '호주 여행', seed: DEFAULT_TRIP.seed, remoteRev: rev, build: bd ? bd.sha : undefined, days };
    saveTrip();
    if (currentDay !== 'all' && currentDay >= trip.days.length) currentDay = 'all';
    renderAll();
    syncBadge('ok');
  } catch (e) { syncBadge('offline'); }
}

document.addEventListener('visibilitychange', () => { if (!document.hidden) syncRemote(); });

// ── 서비스 워커 ───────────────────────────────────────
// updateViaCache:'none' → sw.js를 HTTP 캐시에서 읽지 않으므로 배포 즉시 새 워커를 발견한다.
// 새 워커가 제어권을 잡으면(controllerchange) 한 번만 새로고침 → URL 파라미터 없이 최신 화면.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
    .then(reg => {
      reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    })
    .catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (sessionStorage.getItem('swReloaded')) return; // 새로고침 루프 방지
    sessionStorage.setItem('swReloaded', '1');
    location.reload();
  });
}

const linked = linkTarget();
if (linked !== null) currentDay = linked;
renderAll();
if (linkCandidate() !== null) focusCandidate(linkCandidate());
syncRemote().then(() => {
  // 동기화로 날짜·후보가 늘어난 뒤에도 딥링크가 가리키는 곳을 한 번 더 맞춰준다
  const t = linkTarget();
  if (t !== null && t !== currentDay) { currentDay = t; renderAll(); }
  const c = linkCandidate();
  if (c !== null) focusCandidate(c);
});
</script>
