# GitHub Pages 배포 — 앱 파일만 골라 올린다.
# docs/(기획·예약 메모)는 배포에서 제외 — 프라이빗 레포여도 Pages는 공개 URL이라서.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true # 첫 실행 시 Pages 자동 활성화
      - name: 앱 파일만 담기
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icons leaflet data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
