# GitHub Pages 배포 — 앱 파일만 골라 올린다.
# docs/(기획·예약 메모)는 배포에서 제외 — 프라이빗 레포여도 Pages는 공개 URL이라서.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true # 첫 실행 시 Pages 자동 활성화
      - name: 앱 파일만 담기
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icons leaflet data _site/
      - name: 빌드 버전 주입 (커밋 시각 KST 기준)
        run: |
          SHA=$(git rev-parse --short HEAD)
          EPOCH=$(git log -1 --format=%ct)
          KST=$(TZ=Asia/Seoul date -d "@$EPOCH" '+%m/%d %H:%M')
          sed -i "s/__BUILD_SHA__/$SHA/g; s/__BUILD_EPOCH__/$EPOCH/g; s|__BUILD_KST__|$KST|g" \
            _site/index.html _site/sw.js
          printf '{"sha":"%s","epoch":%s,"builtAt":"%s"}\n' "$SHA" "$EPOCH" "$KST" > _site/data/build.json
          cat _site/data/build.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
